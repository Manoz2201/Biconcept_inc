name: Appwrite

# Deploys TablesDB schema from appwrite.config.json.
# Requires repository secret APPWRITE_API_KEY (tables read/write).
# Do not commit the key.
on:
  push:
    branches: [main]
    paths:
      - appwrite.config.json
      - .github/workflows/appwrite.yml
      - functions/**
      - sites/**
  workflow_dispatch:

concurrency:
  group: appwrite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push tables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a86a3d4001d87aa9809
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Push tables
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "Add GitHub secret APPWRITE_API_KEY (Appwrite API key with tables read/write)."
            exit 1
          fi
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"
          appwrite push tables --all --force
