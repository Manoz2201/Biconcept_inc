name: Appwrite

# Deploys TablesDB schema from appwrite.config.json and copies
# CLOUDFLARE_* GitHub secrets onto workers-ai-proxy function env.
# Requires APPWRITE_API_KEY. Do not commit keys or tokens.
on:
  push:
    branches: [main]
    paths:
      - appwrite.config.json
      - .github/workflows/appwrite.yml
      - functions/**
      - sites/**
  workflow_dispatch:

concurrency:
  group: appwrite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push tables and Workers AI secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a86a3d4001d87aa9809
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Push tables
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "Add GitHub secret APPWRITE_API_KEY (Appwrite API key with tables read/write)."
            exit 1
          fi
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"
          appwrite push tables --all --force

      - name: Push workers-ai-proxy
        run: appwrite push function --function-id workers-ai-proxy --force

      - name: Sync Cloudflare secrets onto workers-ai-proxy
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Add GitHub secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN, then re-run this workflow."
            exit 0
          fi
          python3 <<'PY'
          import json, os, subprocess, sys

          def run(*args):
              result = subprocess.run(["appwrite", *args], capture_output=True, text=True)
              if result.returncode != 0:
                  sys.stderr.write(result.stderr or result.stdout)
                  sys.exit(result.returncode)
              return result.stdout

          raw = run("functions", "list-variables", "--function-id", "workers-ai-proxy", "--json")
          payload = json.loads(raw or "{}")
          items = payload.get("variables") if isinstance(payload, dict) else payload
          if not isinstance(items, list):
              items = []
          by_key = {}
          for item in items:
              if isinstance(item, dict) and item.get("key"):
                  by_key[item["key"]] = item.get("$id") or item.get("id")

          def upsert(key, value):
              variable_id = by_key.get(key)
              if variable_id:
                  run(
                      "functions", "update-variable",
                      "--function-id", "workers-ai-proxy",
                      "--variable-id", variable_id,
                      "--key", key,
                      "--value", value,
                      "--secret",
                  )
                  print(f"Updated {key}")
                  return
              run(
                  "functions", "create-variable",
                  "--function-id", "workers-ai-proxy",
                  "--key", key,
                  "--value", value,
                  "--variable-id", "unique()",
                  "--secret",
              )
              print(f"Created {key}")

          upsert("CLOUDFLARE_ACCOUNT_ID", os.environ["CLOUDFLARE_ACCOUNT_ID"])
          upsert("CLOUDFLARE_API_TOKEN", os.environ["CLOUDFLARE_API_TOKEN"])
          PY
