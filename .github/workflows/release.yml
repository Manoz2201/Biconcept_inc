name: Release

# Publishes a GitHub Release with Android APK + Windows zip.
# Version name comes from the git tag (v1.0.1) or pubspec.yaml.
# Android versionCode / Windows build suffix use the workflow run number.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.1). Leave empty to use pubspec.yaml."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.0"
  UPDATE_REPO: Manoz2201/Biconcept_inc

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(python3 -c 'import re,pathlib; t=pathlib.Path("pubspec.yaml").read_text(); m=re.search(r"^version:\s*([0-9.]+)", t, re.M); assert m, "Could not read version from pubspec.yaml"; print(m.group(1))')
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
          --dart-define=GIT_SHA=${{ github.sha }}
          --dart-define=APP_CHANNEL=release
          --dart-define=UPDATE_REPO=${{ env.UPDATE_REPO }}

      - name: Name APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/biconcept-${{ needs.version.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/biconcept-*-android.apk

  windows:
    name: Windows zip
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Build Windows
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
          --dart-define=GIT_SHA=${{ github.sha }}
          --dart-define=APP_CHANNEL=release
          --dart-define=UPDATE_REPO=${{ env.UPDATE_REPO }}

      - name: Zip runner
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\windows -Recurse -Filter biconcept.exe |
            Where-Object { $_.DirectoryName -match '\\Release$' } |
            Select-Object -First 1
          if (-not $exe) { throw 'biconcept.exe not found under build/windows' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $out = "dist\biconcept-${{ needs.version.outputs.version }}-windows.zip"
          if (Test-Path $out) { Remove-Item $out }
          Compress-Archive -Path (Join-Path $exe.Directory.FullName '*') -DestinationPath $out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/biconcept-*-windows.zip

  release:
    name: GitHub Release
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ needs.version.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          python3 -c 'import json,os,pathlib; pathlib.Path("dist/latest.json").write_text(json.dumps({"schema":"biconcept-release-v1","version":os.environ["VERSION"],"build":int(os.environ["BUILD"]),"tag":os.environ["TAG"],"channel":"release","gitSha":os.environ["GIT_SHA"],"notes":""}, indent=2)+"\n")'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: BiConcept ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/biconcept-*-android.apk
            dist/biconcept-*-windows.zip
            dist/latest.json
          body: |
            BiConcept ${{ needs.version.outputs.version }} (build ${{ needs.version.outputs.build }}).

            Settings → Updates can download the matching Android APK or Windows zip.
